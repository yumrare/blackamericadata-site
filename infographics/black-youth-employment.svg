<svg xmlns="http://www.w3.org/2000/svg" width="900" height="778" viewBox="0 0 900 778"><rect width="900" height="778" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Black Youth Employment</text><text x="450.0" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Ages 16 to 24</text><line x1="90" y1="308" x2="810" y2="308" stroke="#1e50a2" stroke-width="2"/><text x="60" y="358" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1e50a2">Teen Unemployment by Group, Ages 16–19 (Approximate)</text><line x1="60" y1="378" x2="840" y2="378" stroke="#1e50a2" stroke-width="2"/><text x="60" y="436" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Black teenagers</text><rect x="310" y="412" width="520" height="30" fill="#1e50a2"/><text x="842" y="436" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">18%</text><text x="60" y="482" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">All teenagers</text><rect x="310" y="458" width="347" height="30" fill="#1e8a49"/><text x="669" y="482" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">12%</text><text x="60" y="528" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">White teenagers</text><rect x="310" y="504" width="289" height="30" fill="#1e50a2"/><text x="611" y="528" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">10%</text><rect x="60.0" y="558" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="610" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">2x</text><text x="250.0" y="644" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">Black teenage unemployment</text><text x="250.0" y="671" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">runs at roughly twice the</text><text x="250.0" y="698" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">White teenage rate across the</text><rect x="460.0" y="558" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="610" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">1 in 6</text><text x="650.0" y="644" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">young Black Americans are</text><text x="650.0" y="671" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">neither in school nor working</text><text x="650.0" y="698" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">at the peak of the</text><rect x="0" y="732" width="900" height="46" fill="#eef2f6"/><text x="60" y="762" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: Bureau of Labor Statistics; Measure of America</text></svg>