<svg xmlns="http://www.w3.org/2000/svg" width="900" height="878" viewBox="0 0 900 878"><rect width="900" height="878" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">The Black Unemployment</text><text x="450.0" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Rate</text><text x="450.0" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Bureau of Labor Statistics</text><line x1="90" y1="362" x2="810" y2="362" stroke="#1e50a2" stroke-width="2"/><text x="60" y="412" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1e50a2">Unemployment Rate by Group (Annual Average)</text><line x1="60" y1="432" x2="840" y2="432" stroke="#1e50a2" stroke-width="2"/><text x="60" y="490" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Black workers</text><rect x="310" y="466" width="520" height="30" fill="#1e50a2"/><text x="842" y="490" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">5.5%</text><text x="60" y="536" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Hispanic workers</text><rect x="310" y="512" width="435" height="30" fill="#1e8a49"/><text x="757" y="536" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">4.6%</text><text x="60" y="582" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">White workers</text><rect x="310" y="558" width="312" height="30" fill="#1e50a2"/><text x="634" y="582" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">3.3%</text><text x="60" y="628" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Asian workers</text><rect x="310" y="604" width="303" height="30" fill="#1e8a49"/><text x="625" y="628" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">3.2%</text><rect x="60.0" y="658" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="710" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">2 to 1</text><text x="250.0" y="744" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the Black unemployment rate</text><text x="250.0" y="771" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">relative to the White rate,</text><text x="250.0" y="798" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">across five decades of data</text><rect x="460.0" y="658" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="710" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">5.5%</text><text x="650.0" y="744" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">Black unemployment, annual</text><text x="650.0" y="771" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">average, Bureau of Labor</text><text x="650.0" y="798" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">Statistics</text><rect x="0" y="832" width="900" height="46" fill="#eef2f6"/><text x="60" y="862" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: U.S. Bureau of Labor Statistics, Current Population Survey annual averages</text></svg>