<svg xmlns="http://www.w3.org/2000/svg" width="900" height="896" viewBox="0 0 900 896"><rect width="900" height="896" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Black Students in STEM</text><text x="450.0" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Degrees by Field</text><line x1="90" y1="308" x2="810" y2="308" stroke="#1e50a2" stroke-width="2"/><circle cx="450.0" cy="473" r="105" fill="none" stroke="#d4dce3" stroke-width="34"/><circle cx="450.0" cy="473" r="105" fill="none" stroke="#1e50a2" stroke-width="34" stroke-dasharray="59.4 659.7" transform="rotate(-90 450.0 473)"/><text x="450.0" y="486" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#16202b">9%</text><text x="450.0" y="620" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#16202b">Black Share of STEM Bachelor&#x27;s Degrees</text><text x="450.0" y="650" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#16202b">9%</text><rect x="60.0" y="676" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="728" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">~25%</text><text x="250.0" y="762" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">of Black STEM bachelor&#x27;s</text><text x="250.0" y="789" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">degrees are produced by HBCUs</text><text x="250.0" y="816" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">— from about 3% of total</text><rect x="460.0" y="676" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="728" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">Top Producer</text><text x="650.0" y="762" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">Xavier University of Louisiana</text><text x="650.0" y="789" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">sends more Black graduates to</text><text x="650.0" y="816" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">medical school than any</text><rect x="0" y="850" width="900" height="46" fill="#eef2f6"/><text x="60" y="880" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: NSF Science &amp; Engineering Indicators; IPEDS</text></svg>