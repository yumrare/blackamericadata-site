<svg xmlns="http://www.w3.org/2000/svg" width="900" height="870" viewBox="0 0 900 870"><rect width="900" height="870" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">The Black Poverty Rate</text><text x="450.0" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Census Bureau Poverty Report</text><line x1="90" y1="308" x2="810" y2="308" stroke="#1e50a2" stroke-width="2"/><text x="60" y="358" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1e50a2">Official Poverty Rate by Group</text><line x1="60" y1="378" x2="840" y2="378" stroke="#1e50a2" stroke-width="2"/><text x="60" y="436" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Black Americans</text><rect x="310" y="412" width="520" height="30" fill="#1e50a2"/><text x="842" y="436" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">17.1%</text><text x="60" y="482" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Hispanic Americans</text><rect x="310" y="458" width="505" height="30" fill="#1e8a49"/><text x="827" y="482" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">16.6%</text><text x="60" y="528" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">All Americans</text><rect x="310" y="504" width="338" height="30" fill="#1e50a2"/><text x="660" y="528" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">11.1%</text><text x="60" y="574" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Asian Americans</text><rect x="310" y="550" width="252" height="30" fill="#1e8a49"/><text x="574" y="574" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">8.3%</text><text x="60" y="620" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">White, non-Hispanic</text><rect x="310" y="596" width="234" height="30" fill="#1e50a2"/><text x="556" y="620" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">7.7%</text><rect x="60.0" y="650" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="702" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">17.1%</text><text x="250.0" y="736" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">official Black poverty rate,</text><text x="250.0" y="763" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">Census Bureau annual report</text><rect x="460.0" y="650" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="702" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">1 in 4</text><text x="650.0" y="736" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">Black children living in</text><text x="650.0" y="763" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">poverty — more than one in</text><text x="650.0" y="790" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">four</text><rect x="0" y="824" width="900" height="46" fill="#eef2f6"/><text x="60" y="854" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: U.S. Census Bureau, Poverty in the United States</text></svg>