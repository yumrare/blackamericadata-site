<svg xmlns="http://www.w3.org/2000/svg" width="900" height="878" viewBox="0 0 900 878"><rect width="900" height="878" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Black Labor Force</text><text x="450.0" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Participation</text><text x="450.0" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Bureau of Labor Statistics</text><line x1="90" y1="362" x2="810" y2="362" stroke="#1e50a2" stroke-width="2"/><text x="60" y="412" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1e50a2">Labor Force Participation Rate (Approximate)</text><line x1="60" y1="432" x2="840" y2="432" stroke="#1e50a2" stroke-width="2"/><text x="60" y="490" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Black women</text><rect x="310" y="466" width="520" height="30" fill="#1e50a2"/><text x="842" y="490" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">62%</text><text x="60" y="536" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">All workers</text><rect x="310" y="512" width="520" height="30" fill="#1e8a49"/><text x="842" y="536" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">62%</text><text x="60" y="582" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Black adults overall</text><rect x="310" y="558" width="520" height="30" fill="#1e50a2"/><text x="842" y="582" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">62%</text><text x="60" y="628" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">White women</text><rect x="310" y="604" width="486" height="30" fill="#1e8a49"/><text x="808" y="628" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">58%</text><rect x="60.0" y="658" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="710" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">Near Parity</text><text x="250.0" y="744" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">Black participation runs at</text><text x="250.0" y="771" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">roughly the national rate —</text><text x="250.0" y="798" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the unemployment gap is not a</text><rect x="460.0" y="658" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="710" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">Higher for Women</text><text x="650.0" y="744" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">Black women have participated</text><text x="650.0" y="771" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">at higher rates than White</text><text x="650.0" y="798" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">women in every era of the</text><rect x="0" y="832" width="900" height="46" fill="#eef2f6"/><text x="60" y="862" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: U.S. Bureau of Labor Statistics, Current Population Survey</text></svg>