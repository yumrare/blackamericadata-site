<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1148" viewBox="0 0 900 1148"><rect width="900" height="1148" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Black Atlanta: The</text><text x="450.0" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Metropolitan Profile</text><text x="450.0" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Metropolitan Profile</text><line x1="90" y1="362" x2="810" y2="362" stroke="#1e50a2" stroke-width="2"/><text x="450.0" y="410" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#16202b">Black Share of the Metropolitan Population</text><circle cx="450.0" cy="557" r="105" fill="none" stroke="#d4dce3" stroke-width="34"/><circle cx="450.0" cy="557" r="105" fill="none" stroke="#1e50a2" stroke-width="34" stroke-dasharray="224.3 659.7" transform="rotate(-90 450.0 557)"/><text x="450.0" y="570" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#16202b">34%</text><text x="450.0" y="704" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#16202b">Black Share of Metro Atlanta</text><text x="450.0" y="734" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#16202b">34%</text><rect x="60.0" y="760" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="812" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">2 Million+</text>