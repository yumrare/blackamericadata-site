ans-serif" font-size="21" fill="#16202b">populations in the nation</text><rect x="0" y="1102" width="900" height="46" fill="#eef2f6"/><text x="60" y="1132" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: U.S. Census Bureau, American Community Survey; Population Estimates Program</text></svg>