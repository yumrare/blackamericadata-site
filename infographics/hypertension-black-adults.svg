<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1236" viewBox="0 0 900 1236"><rect width="900" height="1236" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Hypertension in Black</text><text x="450.0" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">America</text><text x="450.0" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Nationwide Statistics</text><line x1="90" y1="362" x2="810" y2="362" stroke="#1e50a2" stroke-width="2"/><text x="450.0" y="410" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#16202b">Adults With Hypertension</text><circle cx="225.0" cy="557" r="105" fill="none" stroke="#d4dce3" stroke-width="34"/><circle cx="225.0" cy="557" r="105" fill="none" stroke="#1e50a2" stroke-width="34" stroke-dasharray="362.9 659.7" transform="rotate(-90 225.0 557)"/><text x="225.0" y="570" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#16202b">55%</text><text x="225.0" y="704" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#16202b">Black Adults</text><text x="225.0" y="734" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#16202b">55%</text><circle cx="675.0" cy="557" r="105" fill="none" stroke="#d4dce3" stroke-width="34"/><circle cx="675.0" cy="557" r="105" fill="none" stroke="#1e8a49" stroke-width="34" stroke-dasharray="316.7 659.7" transform="rotate(-90 675.0 557)"/><text x="675.0" y="570" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#16202b">48%</text><text x="675.0" y="704" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#16202b">All U.S. Adults</text><text x="675.0" y="734" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#16202b">48%</text><text x="60" y="770" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1e50a2">Hypertension by Group</text><line x1="60" y1="790" x2="840" y2="790" stroke="#1e50a2" stroke-width="2"/><text x="60" y="848" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Black men</text><rect x="310" y="824" width="520" height="30" fill="#1e50a2"/><text x="842" y="848" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">58%</text><text x="60" y="894" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Black women</text><rect x="310" y="870" width="475" height="30" fill="#1e8a49"/><text x="797" y="894" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">53%</text><text x="60" y="940" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">White adults</text><rect x="310" y="916" width="430" height="30" fill="#1e50a2"/><text x="752" y="940" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">48%</text><text x="60" y="986" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Hispanic adults</text><rect x="310" y="962" width="403" height="30" fill="#1e8a49"/><text x="725" y="986" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">45%</text><rect x="60.0" y="1016" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="1068" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">Stroke Risk</text><text x="250.0" y="1102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">nearly 2x higher for Black</text><text x="250.0" y="1129" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">adults</text><rect x="460.0" y="1016" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="1068" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">Age of Onset</text><text x="650.0" y="1102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">develops earlier in life and</text><text x="650.0" y="1129" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">is often more severe</text><rect x="0" y="1190" width="900" height="46" fill="#eef2f6"/><text x="60" y="1220" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: American Heart Association; CDC National Health and Nutrition Examination Survey</text></svg>