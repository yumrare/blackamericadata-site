<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1190" viewBox="0 0 900 1190"><rect width="900" height="1190" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Black Journalists &amp; Media</text><text x="450.0" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Workers</text><text x="450.0" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Workforce Data</text><line x1="90" y1="362" x2="810" y2="362" stroke="#1e50a2" stroke-width="2"/><text x="450.0" y="410" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#16202b">Black Share of the Newsroom Workforce (Direction)</text><circle cx="450.0" cy="557" r="105" fill="none" stroke="#d4dce3" stroke-width="34"/><circle cx="450.0" cy="557" r="105" fill="none" stroke="#1e50a2" stroke-width="34" stroke-dasharray="46.2 659.7" transform="rotate(-90 450.0 557)"/><text x="450.0" y="570" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#16202b">7%</text><text x="450.0" y="704" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#16202b">Black share of journalists</text><text x="450.0" y="734" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#16202b">7%</text><text x="60" y="770" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1e50a2">The Byline Count (percent, direction)</text><line x1="60" y1="790" x2="840" y2="790" stroke="#1e50a2" stroke-width="2"/><text x="60" y="848" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Black share of newsroom workforce</text><rect x="310" y="824" width="182" height="30" fill="#1e50a2"/><text x="504" y="848" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">7%</text><text x="60" y="894" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Black share of top editors at major outlets</text><rect x="310" y="870" width="130" height="30" fill="#1e8a49"/><text x="452" y="894" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">5%</text><text x="60" y="940" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Black press staff vs historic peak</text><rect x="310" y="916" width="520" height="30" fill="#1e50a2"/><text x="842" y="940" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">20%</text><rect x="60.0" y="970" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="1022" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">Counted by Itself</text><text x="250.0" y="1056" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the industry&#x27;s own honesty in</text><text x="250.0" y="1083" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the annual census: the Black</text><text x="250.0" y="1110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">share climbed from the Kerner</text><rect x="460.0" y="970" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="1022" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">The Draft Writers</text><text x="650.0" y="1056" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the recursion in the archive:</text><text x="650.0" y="1083" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">journalists write the first</text><text x="650.0" y="1110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">draft of every other file —</text><rect x="0" y="1144" width="900" height="46" fill="#eef2f6"/><text x="60" y="1174" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: Newsroom diversity census; BLS</text></svg>