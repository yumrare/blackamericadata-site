, sans-serif" font-size="21" fill="#16202b">the proof in the subsidy data:</text><text x="650.0" y="1083" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">when broadband was discounted,</text><text x="650.0" y="1110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">Black enrollment was heavy —</text><rect x="0" y="1144" width="900" height="46" fill="#eef2f6"/><text x="60" y="1174" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: Pew Research Center internet surveys</text></svg>