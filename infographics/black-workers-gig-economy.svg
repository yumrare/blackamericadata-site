come</text><text x="650.0" y="488" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">supplements rather than</text><rect x="0" y="522" width="900" height="46" fill="#eef2f6"/><text x="60" y="552" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: Pew Research Center; McKinsey &amp; Company; BLS</text></svg>