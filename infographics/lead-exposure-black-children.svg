<svg xmlns="http://www.w3.org/2000/svg" width="900" height="568" viewBox="0 0 900 568"><rect width="900" height="568" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Childhood Lead Exposure</text><text x="450.0" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Environmental Health</text><line x1="90" y1="308" x2="810" y2="308" stroke="#1e50a2" stroke-width="2"/><rect x="60.0" y="348" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">No Safe Level</text><text x="250.0" y="434" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the CDC&#x27;s position: no level</text><text x="250.0" y="461" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">of lead in children&#x27;s blood is</text><text x="250.0" y="488" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">without effect — the reference</text><rect x="460.0" y="348" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">Housing&#x27;s Age</text><text x="650.0" y="434" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the exposure map is a</text><text x="650.0" y="461" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">housing-age map — pre-1978</text><text x="650.0" y="488" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">paint in the older, poorer</text><rect x="0" y="522" width="900" height="46" fill="#eef2f6"/><text x="60" y="552" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: CDC lead surveillance; NHANES</text></svg>