<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980"><rect width="900" height="980" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Black Students &amp; Chronic</text><text x="450.0" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Absenteeism</text><text x="450.0" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Attendance Data</text><line x1="90" y1="362" x2="810" y2="362" stroke="#1e50a2" stroke-width="2"/><text x="450.0" y="410" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#16202b">Black Students Chronically Absent, Post-Pandemic Peak</text><circle cx="450.0" cy="557" r="105" fill="none" stroke="#d4dce3" stroke-width="34"/><circle cx="450.0" cy="557" r="105" fill="none" stroke="#1e50a2" stroke-width="34" stroke-dasharray="197.9 659.7" transform="rotate(-90 450.0 557)"/><text x="450.0" y="570" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#16202b">30%</text><text x="450.0" y="704" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#16202b">Chronically absent (10%+ of days)</text><text x="450.0" y="734" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#16202b">30%</text><rect x="60.0" y="760" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="812" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">~2× Pre-Pandemic</text><text x="250.0" y="846" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the chronic-absence rate&#x27;s</text><text x="250.0" y="873" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">jump across the pandemic years</text><text x="250.0" y="900" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">in the national analyses —</text><rect x="460.0" y="760" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="812" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">1 in 5 by Kindergarten</text><text x="650.0" y="846" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the pattern is set early:</text><text x="650.0" y="873" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">chronic absence in the first</text><text x="650.0" y="900" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">school years predicts the</text><rect x="0" y="934" width="900" height="46" fill="#eef2f6"/><text x="60" y="964" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: Attendance Works; CRDC</text></svg>