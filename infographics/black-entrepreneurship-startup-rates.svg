<svg xmlns="http://www.w3.org/2000/svg" width="900" height="622" viewBox="0 0 900 622"><rect width="900" height="622" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Black Entrepreneurship</text><text x="450.0" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Rates</text><text x="450.0" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Business Formation</text><line x1="90" y1="362" x2="810" y2="362" stroke="#1e50a2" stroke-width="2"/><rect x="60.0" y="402" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="454" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">0.38%</text><text x="250.0" y="488" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">of Black adults start a new</text><text x="250.0" y="515" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">business each month in recent</text><text x="250.0" y="542" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">Kauffman measurements — above</text><rect x="460.0" y="402" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="454" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">The Conversion Gap</text><text x="650.0" y="488" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">Black-founded firms convert to</text><text x="650.0" y="515" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">employer status and scale at</text><text x="650.0" y="542" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the lowest rates of any group</text><rect x="0" y="576" width="900" height="46" fill="#eef2f6"/><text x="60" y="606" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: Kauffman Indicators; Census Bureau ABS/BDS</text></svg>