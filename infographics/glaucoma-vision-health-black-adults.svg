<svg xmlns="http://www.w3.org/2000/svg" width="900" height="732" viewBox="0 0 900 732"><rect width="900" height="732" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Glaucoma &amp; Vision Health</text><text x="450.0" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Chronic Condition Data</text><line x1="90" y1="308" x2="810" y2="308" stroke="#1e50a2" stroke-width="2"/><text x="60" y="358" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1e50a2">Relative Burden in the Major Studies</text><line x1="60" y1="378" x2="840" y2="378" stroke="#1e50a2" stroke-width="2"/><text x="60" y="436" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Glaucoma prevalence vs white adults</text><rect x="310" y="412" width="520" height="30" fill="#1e50a2"/><text x="842" y="436" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">100%</text><text x="60" y="482" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Blindness from glaucoma (relative)</text><rect x="310" y="458" width="478" height="30" fill="#1e8a49"/><text x="800" y="482" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">92%</text><rect x="60.0" y="512" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="564" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">4–5×</text><text x="250.0" y="598" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the prevalence multiple for</text><text x="250.0" y="625" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">open-angle glaucoma in Black</text><text x="250.0" y="652" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">adults in the Baltimore Eye</text><rect x="460.0" y="512" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="564" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">Earlier by ~10 Years</text><text x="650.0" y="598" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the typical onset shift —</text><text x="650.0" y="625" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">glaucoma arrives younger and</text><text x="650.0" y="652" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">progresses faster in the</text><rect x="0" y="686" width="900" height="46" fill="#eef2f6"/><text x="60" y="716" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: National Eye Institute; Baltimore Eye Survey</text></svg>