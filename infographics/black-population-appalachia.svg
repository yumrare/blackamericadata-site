<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980"><rect width="900" height="980" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Black Population:</text><text x="450.0" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Appalachia</text><text x="450.0" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Regional Profile</text><line x1="90" y1="362" x2="810" y2="362" stroke="#1e50a2" stroke-width="2"/><text x="450.0" y="410" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#16202b">Black Share of Appalachian Population (ARC Region)</text><circle cx="450.0" cy="557" r="105" fill="none" stroke="#d4dce3" stroke-width="34"/><circle cx="450.0" cy="557" r="105" fill="none" stroke="#1e50a2" stroke-width="34" stroke-dasharray="52.8 659.7" transform="rotate(-90 450.0 557)"/><text x="450.0" y="570" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#16202b">8%</text><text x="450.0" y="704" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#16202b">Black or African American</text><text x="450.0" y="734" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#16202b">8%</text><rect x="60.0" y="760" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="812" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">~1 Million People</text><text x="250.0" y="846" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">Black residents across the</text><text x="250.0" y="873" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">423-county Appalachian region</text><text x="250.0" y="900" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">— concentrated in its southern</text><rect x="460.0" y="760" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="812" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">Affrilachia</text><text x="650.0" y="846" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the word poet Frank X Walker</text><text x="650.0" y="873" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">coined in 1991 for the Black</text><text x="650.0" y="900" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">mountain experience — now in</text><rect x="0" y="934" width="900" height="46" fill="#eef2f6"/><text x="60" y="964" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: ARC; Census County Data</text></svg>