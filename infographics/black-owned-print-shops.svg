 sans-serif" font-size="21" fill="#16202b">receipts data: paper shrank,</text><text x="650.0" y="1056" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">surfaces grew — wraps, signs,</text><rect x="0" y="1090" width="900" height="46" fill="#eef2f6"/><text x="60" y="1120" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: Annual Business Survey; County Business Patterns</text></svg>