<svg xmlns="http://www.w3.org/2000/svg" width="900" height="568" viewBox="0 0 900 568"><rect width="900" height="568" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Black Children &amp; Youth</text><text x="450.0" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Age Structure</text><line x1="90" y1="308" x2="810" y2="308" stroke="#1e50a2" stroke-width="2"/><rect x="60.0" y="348" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">14 Million</text><text x="250.0" y="434" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">Black Americans under age 18,</text><text x="250.0" y="461" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">approximately — about one in</text><text x="250.0" y="488" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">five Black residents</text><rect x="460.0" y="348" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">Younger</text><text x="650.0" y="434" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the Black population&#x27;s median</text><text x="650.0" y="461" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">age (~35) runs about four</text><text x