<svg xmlns="http://www.w3.org/2000/svg" width="900" height="926" viewBox="0 0 900 926"><rect width="900" height="926" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Black Lawyers &amp; Judges</text><text x="450.0" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Professional Workforce Data</text><line x1="90" y1="308" x2="810" y2="308" stroke="#1e50a2" stroke-width="2"/><text x="450.0" y="356" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#16202b">Black Share of U.S. Lawyers</text><circle cx="450.0" cy="503" r="105" fill="none" stroke="#d4dce3" stroke-width="34"/><circle cx="450.0" cy="503" r="105" fill="none" stroke="#1e50a2" stroke-width="34" stroke-dasharray="33.0 659.7" transform="rotate(-90 450.0 503)"/><text x="450.0" y="516" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#16202b">5%</text><text x="450.0" y="650" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#16202b">Black or African American</text><text x="450.0" y="680" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#16202b">5%</text><rect x="60.0" y="706" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="758" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">~5%, Flat</text><text x="250.0" y="792" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the Black share of the bar</text><text x="250.0" y="819" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">across a decade of ABA counts</text><text x="250.0" y="846" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">— the profession&#x27;s</text><rect x="460.0" y="706" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="758" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">Record Federal Bench</text><text x="650.0" y="792" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">recent appointment waves</text><text x="650.0" y="819" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">brought Black judges to their</text><text x="650.0" y="846" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">highest share of the federal</text><rect x="0" y="880" width="900" height="46" fill="#eef2f6"/><text x="60" y="910" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: ABA Profile of the Legal Profession</text></svg>