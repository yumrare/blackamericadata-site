<svg xmlns="http://www.w3.org/2000/svg" width="900" height="786" viewBox="0 0 900 786"><rect width="900" height="786" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Uterine Fibroids in Black</text><text x="450.0" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Women</text><text x="450.0" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Women&#x27;s Health Data</text><line x1="90" y1="362" x2="810" y2="362" stroke="#1e50a2" stroke-width="2"/><text x="60" y="412" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1e50a2">Cumulative Incidence by Age 50 (Ultrasound-Screened Studies)</text><line x1="60" y1="432" x2="840" y2="432" stroke="#1e50a2" stroke-width="2"/><text x="60" y="490" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Black women</text><rect x="310" y="466" width="520" height="30" fill="#1e50a2"/><text x="842" y="490" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">80%</text><text x="60" y="536" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">White women</text><rect x="310" y="512" width="455" height="30" fill="#1e8a49"/><text x="777" y="536" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">70%</text><rect x="60.0" y="566" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="618" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">~3×</text><text x="250.0" y="652" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the relative incidence of</text><text x="250.0" y="679" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">fibroids in Black women versus</text><text x="250.0" y="706" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">white women in the</text><rect x="460.0" y="566" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="618" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">Earlier &amp; Larger</text><text x="650.0" y="652" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the consistent finding: onset</text><text x="650.0" y="679" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">years younger, tumors more</text><text x="650.0" y="706" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">numerous and larger at</text><rect x="0" y="740" width="900" height="46" fill="#eef2f6"/><text x="60" y="770" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: NIEHS Uterine Fibroid Study; AHRQ</text></svg>