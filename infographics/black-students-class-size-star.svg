<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980"><rect width="900" height="980" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Black Students &amp; Class</text><text x="450.0" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Size</text><text x="450.0" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">School Conditions Data</text><line x1="90" y1="362" x2="810" y2="362" stroke="#1e50a2" stroke-width="2"/><text x="450.0" y="410" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#16202b">Average Elementary Class Size in Majority-Black Schools vs. National (NCES Direction)</text><circle cx="450.0" cy="557" r="105" fill="none" stroke="#d4dce3" stroke-width="34"/><circle cx="450.0" cy="557" r="105" fill="none" stroke="#1e50a2" stroke-width="34" stroke-dasharray="158.3 659.7" transform="rotate(-90 450.0 557)"/><text x="450.0" y="570" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#16202b">24%</text><text x="450.0" y="704" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#16202b">Students per class</text><text x="450.0" y="734" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#16202b">24%</text><rect x="60.0" y="760" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="812" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">The STAR Result</text><text x="250.0" y="846" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the randomized trial&#x27;s core</text><text x="250.0" y="873" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">number: small K-3 classes</text><text x="250.0" y="900" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">(13–17) beat regular ones</text><rect x="460.0" y="760" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="812" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">The Lasting Trace</text><text x="650.0" y="846" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the follow-up studies&#x27; finding</text><text x="650.0" y="873" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">that followed the STAR</text><text x="650.0" y="900" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">children into adulthood: the</text><rect x="0" y="934" width="900" height="46" fill="#eef2f6"/><text x="60" y="964" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: Project STAR; NCES; Brookings</text></svg>