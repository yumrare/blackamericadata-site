<svg xmlns="http://www.w3.org/2000/svg" width="900" height="736" viewBox="0 0 900 736"><rect width="900" height="736" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">HBCUs by the Numbers</text><text x="450.0" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Federal Education Data</text><line x1="90" y1="308" x2="810" y2="308" stroke="#1e50a2" stroke-width="2"/><rect x="60.0" y="348" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">100+</text><text x="250.0" y="434" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">historically Black colleges</text><text x="250.0" y="461" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">and universities in the United</text><text x="250.0" y="488" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">States</text><rect x="460.0" y="348" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">290,000</text><text x="650.0" y="434" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">students enrolled at HBCUs,</text><text x="650.0" y="461" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">approximately</text><rect x="60.0" y="516" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="568" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">1 in 6</text><text x="250.0" y="602" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">Black bachelor&#x27;s degrees</text><text x="250.0" y="629" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">awarded by HBCUs,</text><text x="250.0" y="656" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">approximately</text><rect x="460.0" y="516" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="568" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">$12.8 Billion</text><text x="650.0" y="602" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">federal estimate of the</text><text x="650.0" y="629" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">land-grant funding gap for</text><text x="650.0" y="656" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">HBCUs across 16 states over</text><rect x="0" y="690" width="900" height="46" fill="#eef2f6"/><text x="60" y="720" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: National Center for Education Statistics, IPEDS; U.S. Department of Education</text></svg>