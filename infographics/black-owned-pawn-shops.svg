elvetica, Arial, sans-serif" font-size="21" fill="#16202b">data: four of five loans are</text><text x="650.0" y="1056" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">redeemed — the forfeited shelf</text><rect x="0" y="1090" width="900" height="46" fill="#eef2f6"/><text x="60" y="1120" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: Annual Business Survey; pawn industry data</text></svg>