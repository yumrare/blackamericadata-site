nt-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">older, approximately</text><rect x="460.0" y="706" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="758" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">Age 35</text><text x="650.0" y="792" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the Black median age, against</text><text x="650.0" y="819" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">about 39 for the nation — a</text><text x="650.0" y="846" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">younger population that is</text><rect x="0" y="880" width="900" height="46" fill="#eef2f6"/><text x="60" y="910" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: U.S. Census Bureau, American Community Survey; Administration for Community Living</text></svg>