<svg xmlns="http://www.w3.org/2000/svg" width="900" height="824" viewBox="0 0 900 824"><rect width="900" height="824" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Obesity in Black America</text><text x="450.0" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">NHANES Examination Data</text><line x1="90" y1="308" x2="810" y2="308" stroke="#1e50a2" stroke-width="2"/><text x="60" y="358" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1e50a2">Adult Obesity Prevalence by Group (NHANES, Approximate)</text><line x1="60" y1="378" x2="840" y2="378" stroke="#1e50a2" stroke-width="2"/><text x="60" y="436" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Black adults</text><rect x="310" y="412" width="520" height="30" fill="#1e50a2"/><text x="842" y="436" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">50%</text><text x="60" y="482" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Hispanic adults</text><rect x="310" y="458" width="478" height="30" fill="#1e8a49"/><text x="800" y="482" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">46%</text><text x="60" y="528" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">White adults</text><rect x="310" y="504" width="426" height="30" fill="#1e50a2"/><text x="748" y="528" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">41%</text><text x="60" y="574" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">Asian adults</text><rect x="310" y="550" width="166" height="30" fill="#1e8a49"/><text x="488" y="574" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">16%</text><rect x="60.0" y="604" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="656" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">49.9%</text><text x="250.0" y="690" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">of Black adults meet the</text><text x="250.0" y="717" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">obesity definition — the</text><text x="250.0" y="744" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">highest of any major group</text><rect x="460.0" y="604" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="656" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">57%</text><text x="650.0" y="690" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">of Black women — the highest</text><text x="650.0" y="717" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">rate of any demographic group</text><text x="650.0" y="744" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">in the national data</text><rect x="0" y="778" width="900" height="46" fill="#eef2f6"/><text x="60" y="808" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: CDC, National Health and Nutrition Examination Survey</text></svg>