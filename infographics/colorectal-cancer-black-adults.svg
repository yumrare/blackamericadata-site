<svg xmlns="http://www.w3.org/2000/svg" width="900" height="622" viewBox="0 0 900 622"><rect width="900" height="622" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Colorectal Cancer &amp; Black</text><text x="450.0" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Adults</text><text x="450.0" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Cancer Profile</text><line x1="90" y1="362" x2="810" y2="362" stroke="#1e50a2" stroke-width="2"/><rect x="60.0" y="402" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="454" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">Highest Mortality</text><text x="250.0" y="488" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">Black adults&#x27; colorectal</text><text x="250.0" y="515" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">cancer death rates run the</text><text x="250.0" y="542" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">highest of any major racial</text><rect x="460.0" y="402" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="454" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">Age 45</text><text x="650.0" y="488" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">screening now begins at 45 for</text><text x="650.0" y="515" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">average-risk adults — lowered</text><text x="650.0" y="542" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">partly on the early-onset and</text><rect x="0" y="576" width="900" height="46" fill="#eef2f6"/><text x="60" y="606" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: NCI SEER; American Cancer Society</text></svg>