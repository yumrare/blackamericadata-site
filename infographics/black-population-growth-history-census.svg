<svg xmlns="http://www.w3.org/2000/svg" width="900" height="970" viewBox="0 0 900 970"><rect width="900" height="970" fill="#ffffff"/><image href="../assets/emblem.webp" x="380.0" y="16" width="140" height="140"/><text x="450.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" letter-spacing="3" fill="#16202b">BLACK AMERICA DATA</text><text x="450.0" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">Black Population Growth,</text><text x="450.0" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="47" font-weight="bold" fill="#16202b">1790–2020</text><text x="450.0" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1e50a2">Historical Demography</text><line x1="90" y1="362" x2="810" y2="362" stroke="#1e50a2" stroke-width="2"/><text x="60" y="412" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1e50a2">Black Population by Census (Millions, Rounded)</text><line x1="60" y1="432" x2="840" y2="432" stroke="#1e50a2" stroke-width="2"/><text x="60" y="490" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">1790</text><rect x="310" y="466" width="10" height="30" fill="#1e50a2"/><text x="332" y="490" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">2%</text><text x="60" y="536" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">1860</text><rect x="310" y="512" width="57" height="30" fill="#1e8a49"/><text x="379" y="536" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">11%</text><text x="60" y="582" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">1900</text><rect x="310" y="558" width="114" height="30" fill="#1e50a2"/><text x="436" y="582" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">22%</text><text x="60" y="628" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">1950</text><rect x="310" y="604" width="198" height="30" fill="#1e8a49"/><text x="520" y="628" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">38%</text><text x="60" y="674" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">2000</text><rect x="310" y="650" width="452" height="30" fill="#1e50a2"/><text x="774" y="674" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">87%</text><text x="60" y="720" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#16202b">2020</text><rect x="310" y="696" width="520" height="30" fill="#1e8a49"/><text x="842" y="720" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16202b">100%</text><rect x="60.0" y="750" width="380.0" height="150" rx="16" fill="#e3ecf7"/><text x="250.0" y="802" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">757,208</text><text x="250.0" y="836" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">Black Americans counted in the</text><text x="250.0" y="863" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">first census of 1790 — about</text><text x="250.0" y="890" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">19% of the young nation&#x27;s</text><rect x="460.0" y="750" width="380.0" height="150" rx="16" fill="#e2f2e7"/><text x="650.0" y="802" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16202b">~62×</text><text x="650.0" y="836" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">the growth multiple from 1790</text><text x="650.0" y="863" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">to 2020 — achieved against a</text><text x="650.0" y="890" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#16202b">falling population share (19%</text><rect x="0" y="924" width="900" height="46" fill="#eef2f6"/><text x="60" y="954" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#44545f">Sources: U.S. Census Bureau, Decennial Censuses</text></svg>